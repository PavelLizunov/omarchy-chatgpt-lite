<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'">
  <title>Local baseline fixture</title>
</head>
<body>
  <main>
    <h1>Local baseline fixture</h1>
    <p>No external resources, authentication or message submission.</p>
    <form onsubmit="event.preventDefault()">
      <label for="draft">Draft</label>
      <textarea id="draft" name="draft">Retain this local draft when hidden.</textarea>
      <button type="submit">Local action</button>
    </form>
    <button id="popup" onclick="window.open('popup.html', 'fixture-popup')">Open local linked window</button>
  </main>
</body>
</html>
